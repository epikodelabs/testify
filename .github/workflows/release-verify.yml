name: Release verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/verify-publish.mjs'
      - 'package.json'
      - 'build-package.js'
      - 'vite.*.config.ts'
      - 'tsconfig*.json'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install

      - run: npm run verify:release
